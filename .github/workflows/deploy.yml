name: Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: web-consumer
            vercelProjectId: ${{ secrets.VERCEL_PROJECT_ID_CONSUMER }}
          - app: web-callcenter
            vercelProjectId: ${{ secrets.VERCEL_PROJECT_ID_CALLCENTER }}
          - app: web-tech
            vercelProjectId: ${{ secrets.VERCEL_PROJECT_ID_TECH }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm -C apps/${{ matrix.app }} build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.example.com' }}

      - name: Deploy to Vercel (production)
        uses: vercel/action@v3
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ matrix.vercelProjectId }}
          working-directory: apps/${{ matrix.app }}
          prod: true
